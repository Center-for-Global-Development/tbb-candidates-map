<!doctype html>
<html lang="en" data-cgd-interactive-name="dtv-tbb-candidates-map">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Where are the skilled refugees the UK could recruit?</title>
<link rel="stylesheet" href="shared/cgd-figure.css?v=20261120e">
<link rel="stylesheet" href="shared/cgd-responsive.css?v=20261120e">
<style>
  /* Desktop: one control row — the occupation band, then the occupation.
     The band control carries the shortage list as a fifth option rather than a
     checkbox beside it: the two were never independent (every shortage-list
     occupation is RQF 3–5), so a separate control had to be disabled half the
     time and looked like a live filter that did nothing. */
  #controls{flex-wrap:nowrap}
  .band-control{flex:0 0 auto}
  .occ-control{flex:1 1 auto;min-width:0}
  .segmented button{white-space:nowrap}
  #bandToggle{display:flex}
  #bandToggle button{flex:1 1 auto}

  /* The five bands stay on one row at every width. They were wrapping to two
     because of a rule here, not because they did not fit: the full labels need
     280px and there is more than that down to about 335px of panel. Below
     that the labels shorten rather than the row breaking, which costs a line
     of control bank — at a third of a laptop screen the controls were as tall
     as the map. The full wording stays in aria-label either way. */
  #bandToggle,.cgd-mobile-embed #bandToggle{flex-wrap:nowrap}
  #bandToggle button,.cgd-mobile-embed #bandToggle button{flex:1 1 auto;min-width:0}
  .b-short{display:none}
  @media (max-width:760px){
    .occ-control,.band-control{grid-column:1/-1}
    #bandToggle button{padding-inline:6px}
  }
  @media (max-width:384px){
    .b-long{display:none}
    .b-short{display:inline}
    #bandToggle button{padding-inline:5px}
  }
  .cgd-mobile-embed .occ-control,
  .cgd-mobile-embed .band-control{grid-column:1/-1}

  /* Title above the key at every width: the two sit on separate rows so the
     figure does not shift when the subtitle or the key text changes length. */
  .panel-header{grid-template-columns:minmax(0,1fr);gap:4px}
  .legend-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
  .legend-row .panel-title{flex:1 1 auto;min-width:0;white-space:normal}
  /* 215px, not 190: "United Arab Emirates" needs 155px of text box and was
     being cut at every width, including the widest. */
  .legend-row select{flex:0 0 215px;width:215px;height:30px;min-height:30px;padding-top:3px;padding-bottom:3px}
  /* Narrow: the select keeps the title's row instead of taking one of its own.
     The title wraps into the space left over, which costs nothing, where a
     full-width select cost a whole control row. */
  @media (max-width:600px){
    .legend-row{flex-wrap:nowrap}
    .legend-row select{flex:0 1 190px;width:auto;min-width:104px}
  }
  .scale-legend{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;font-size:10.2px;color:var(--cgd-dark-gray)}
  .scale-legend .bin{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .scale-legend .chip{width:18px;height:10px;border:1px solid rgba(26,39,42,.10);flex:0 0 auto}
  .scale-legend .chip.ho{background:#fff;border:2px solid var(--cgd-gold)}

  .map{position:relative;background:#F2F7F8;border:1px solid #EDF2F3;border-radius:10px;overflow:hidden}
  /* On the map, not in the control bank: the bank is already the tallest thing
     on a narrow screen and these must not add a row to it. */
  .zoom-ctl{position:absolute;top:8px;left:8px;z-index:3;display:flex;flex-direction:column;gap:4px}
  .zoom-ctl button{width:28px;height:28px;min-height:28px;display:flex;align-items:center;justify-content:center;
    padding:0;border:1px solid var(--border,#D9E1E4);border-radius:7px;background:rgba(255,255,255,.94);
    color:var(--cgd-teal);font:inherit;font-size:16px;line-height:1;font-weight:600;cursor:pointer}
  .zoom-ctl button:hover{background:#fff;border-color:var(--cgd-light-teal)}
  .zoom-ctl button:focus-visible{outline:2px solid var(--cgd-teal);outline-offset:1px}
  .zoom-ctl button[disabled]{opacity:.4;cursor:default}
  /* Where the map is short, a stacked column would run most of its height. */
  @media (max-width:480px){.zoom-ctl{flex-direction:row}}
  .map.panning{cursor:grabbing}
  .map.panning .country,.map.panning .hit{cursor:grabbing}
  .map svg{display:block;width:100%;height:auto;touch-action:manipulation}
  .context{fill:#E9EBEC;stroke:#fff;stroke-width:.5;vector-effect:non-scaling-stroke;pointer-events:none}
  /* A darker boundary than the context's white, so the 26 catalogue countries
     read as one set even where the fill is at the pale end of the ramp. */
  .country{stroke:#7E9499;stroke-width:.7;vector-effect:non-scaling-stroke;cursor:pointer;stroke-linejoin:miter;stroke-miterlimit:2;
    transition:filter .12s ease}
  .country.small{paint-order:stroke fill}
  /* Hover lifts the country off the map with a soft halo rather than changing
     its colour. The fill is the data and the gold ring means "first phase", so
     neither can be borrowed to say "your pointer is here"; a shadow belongs to
     no scale and reads the same over the palest class and the darkest. It is
     also why the countries outside the catalogue do not respond — they take no
     pointer events, so the halo doubles as "this one can be opened". */
  .map svg .country:hover,
  .map svg .hit:hover + .country{filter:drop-shadow(0 0 2.5px rgba(11,76,91,.62))}
  /* Invisible, and deliberately so: it enlarges the target, never the country. */
  .hit{fill:none;stroke:rgba(0,0,0,0);vector-effect:non-scaling-stroke;cursor:pointer}
  @media (prefers-reduced-motion:reduce){.country{transition:none}}
  /* The gold ring marks the seven countries of the first phase. It is drawn as
     its own layer above every fill so a neighbour's fill cannot paint over it,
     and it is never used for hover or selection — those are teal-black, so the
     reader cannot mistake "selected" for "chosen by the Home Office". */
  .ho-ring{fill:none;stroke:var(--cgd-gold);stroke-width:1.9;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
  .outline{fill:none;stroke:var(--cgd-teal-black);stroke-width:2.2;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
  /* The shared rule paints SVG keyboard focus gold. Gold means "one of the
     seven" on this map, so focus is re-pointed at the same teal-black the
     selected outline uses — more specific than the shared selector. */
  .map svg [tabindex]:focus-visible{stroke:var(--cgd-teal-black);stroke-width:2.2;paint-order:stroke}

  /* ---- country drill-down -------------------------------------------------
     Anchored over the map panel, not the viewport. The figure is embedded in a
     page that sizes the iframe to the whole content, so a viewport-fixed card
     centres itself in the full document height and can land off-screen; over
     the panel it always opens where the reader just clicked. Below 620px the
     same card is centred over the whole figure instead — see the rule further
     down — because the panel alone is too short to hold it. */
  .chart-area{position:relative}
  .cmap-backdrop{position:absolute;inset:0;z-index:30;background:rgba(26,39,42,.38);
    display:flex;align-items:center;justify-content:center;padding:10px;border-radius:10px}
  .cmap-card{width:min(430px,100%);max-height:100%;display:flex;flex-direction:column;
    background:#fff;border-radius:12px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
  .cmap-top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
  .cmap-top h3{margin:0;color:var(--cgd-teal);font-size:14.5px;line-height:1.2}
  .cmap-top .sub{margin:2px 0 0;font-size:11.4px;color:var(--cgd-dark-gray)}
  .cmap-close{flex:0 0 auto;width:30px;height:30px;border:1px solid var(--border,#D9E1E4);
    border-radius:8px;background:#fff;color:var(--cgd-teal);font:inherit;font-size:17px;
    line-height:1;cursor:pointer}
  #occBand{display:flex;margin:10px 0 8px}
  #occBand button{flex:1 1 auto;white-space:nowrap;padding-inline:5px;font-size:11px}
  /* One height whatever the country, so paging between countries does not make
     the card jump: short lists simply leave space below. */
  .occ-list{flex:1 1 auto;height:214px;overflow-y:auto;overscroll-behavior:contain;
    padding-right:2px;border-top:1px solid var(--border,#D9E1E4)}
  .occ-row{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:6px 8px;align-items:center;
    padding:5px 1px 4px;border-bottom:1px solid #F0F4F5;font-size:11.6px;cursor:default}
  .occ-row:hover{background:#F6FAFB}
  .occ-row .nm{min-width:0;overflow-wrap:anywhere;color:var(--cgd-teal-black)}
  .occ-row .vl{text-align:right;font-weight:700;color:var(--cgd-teal);font-variant-numeric:tabular-nums}
  .occ-row .track{grid-column:1/-1;height:5px;background:#EDF2F3;border-radius:3px;overflow:hidden}
  .occ-row .track i{display:block;height:100%;background:#2D99B5;border-radius:3px}
  .occ-empty{padding:14px 2px;font-size:11.6px;color:var(--cgd-dark-gray)}

  /* Narrow: the card still floats, but over the whole figure rather than over
     the map alone. The map is only about 150px tall here and a card cannot
     float over that — which is why this used to be a section under the map,
     with the frame growing by about 400px to fit it.

     That growth depends on the parent applying the height the figure reports,
     and on cgdev.org nothing listens for it (see README, Embedding). The
     figure was published inside a fixed-height iframe, where growing means
     being clipped. Floating over the whole figure keeps the body height
     constant in every state, so a fixed height is always the right height.

     Done by taking the positioning context off .chart-area rather than by
     switching to position:fixed. Fixed would resolve against the iframe's
     viewport, which once the parent does size the frame to its content is the
     whole document — a card centred in that can sit off-screen. The figure is
     about a screenful, so centring in it always lands where the reader is. */
  @media (max-width:620px){
    .chart-area{position:static}
    .cmap-backdrop{padding:12px;border-radius:10px}
    .cmap-card{width:100%;max-width:420px}
    #occBand button{font-size:10.5px;padding-inline:4px}
  }
  .cgd-mobile-embed .chart-area{position:static}
  .cgd-mobile-embed .cmap-backdrop{padding:12px;border-radius:10px}
  .cgd-mobile-embed .cmap-card{width:100%;max-width:420px}
  .cgd-mobile-embed #occBand button{font-size:10.5px;padding-inline:4px}

  .notes a{color:var(--cgd-light-teal);text-decoration:underline}
  .notes a:hover{color:var(--cgd-teal)}
</style>
</head>
<body>
<div id="vizRoot" class="viz-wrapper">
  <div class="header-row">
    <div class="title-block">
      <h1 id="vizTitle">Where are the skilled refugees the UK could recruit?</h1>
    </div>
    <button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="View fullscreen" data-tip="View fullscreen">
      <svg class="icon-expand" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="icon-compress" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="controls" id="controls" aria-label="Map filters">
    <div class="control-group band-control">
      <div class="control-label" id="bandLabel">Occupations</div>
      <div class="segmented" id="bandToggle" role="group" aria-labelledby="bandLabel">
        <button type="button" data-band="ALL" aria-pressed="true" aria-label="All occupations"><span class="b-long">All</span><span class="b-short">All</span></button>
        <button type="button" data-band="RQF 6+" aria-pressed="false" aria-label="RQF 6 and above"><span class="b-long">RQF&nbsp;6+</span><span class="b-short">6+</span></button>
        <button type="button" data-band="RQF 3-5" aria-pressed="false" aria-label="RQF 3 to 5"><span class="b-long">RQF&nbsp;3&#8211;5</span><span class="b-short">3&#8211;5</span></button>
        <button type="button" data-band="RQF 1-2" aria-pressed="false" aria-label="RQF 1 to 2"><span class="b-long">RQF&nbsp;1&#8211;2</span><span class="b-short">1&#8211;2</span></button>
        <button type="button" data-band="TSL" aria-pressed="false" aria-label="Shortage list"><span class="b-long">Shortage&nbsp;list</span><span class="b-short">Shortage</span></button>
      </div>
    </div>
    <div class="control-group occ-control">
      <label for="occSelect">Occupation</label>
      <select id="occSelect" class="plain-select"></select>
    </div>
  </div>

  <section class="panel">
    <div class="panel-header">
      <div class="legend-row">
        <h2 class="panel-title" id="panelTitle">Candidates by country of residence</h2>
        <select id="countrySelect" class="plain-select" aria-label="Find a country"></select>
      </div>
      <div class="scale-legend" id="scaleLegend"></div>
    </div>
    <div class="chart-area">
      <div class="map" id="map">
        <div class="zoom-ctl" id="zoomCtl">
          <button type="button" id="zoomIn" aria-label="Zoom in" data-tip="Zoom in">+</button>
          <button type="button" id="zoomOut" aria-label="Zoom out" data-tip="Zoom out">&#8722;</button>
          <button type="button" id="zoomReset" aria-label="Reset the view" data-tip="Reset the view" hidden>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div class="cmap-backdrop" id="drill" hidden>
      <div class="cmap-card" role="dialog" aria-modal="true" aria-labelledby="drillTitle">
        <div class="cmap-top">
          <div>
            <h3 id="drillTitle"></h3>
            <p class="sub" id="drillSub"></p>
          </div>
          <button type="button" class="cmap-close" id="drillClose" aria-label="Close">&#215;</button>
        </div>
        <div class="segmented" id="occBand" role="group" aria-label="Skill level within this country">
          <button type="button" data-band="ALL" aria-pressed="true" aria-label="All occupations"><span class="b-long">All</span><span class="b-short">All</span></button>
          <button type="button" data-band="RQF 6+" aria-pressed="false" aria-label="RQF 6 and above"><span class="b-long">RQF&nbsp;6+</span><span class="b-short">6+</span></button>
          <button type="button" data-band="RQF 3-5" aria-pressed="false" aria-label="RQF 3 to 5"><span class="b-long">RQF&nbsp;3&#8211;5</span><span class="b-short">3&#8211;5</span></button>
          <button type="button" data-band="RQF 1-2" aria-pressed="false" aria-label="RQF 1 to 2"><span class="b-long">RQF&nbsp;1&#8211;2</span><span class="b-short">1&#8211;2</span></button>
          <button type="button" data-band="TSL" aria-pressed="false" aria-label="Shortage list"><span class="b-long">Shortage&nbsp;list</span><span class="b-short">Shortage</span></button>
        </div>
        <div class="occ-list" id="drillList"></div>
      </div>
      </div>
    </div>
  </section>

  <div class="notes" id="notes"></div>
  <div class="tooltip" id="tooltip" hidden></div>
</div>

<script src="shared/dom.js?v=20261120e"></script>
<script src="shared/chart-core.js?v=20261120e"></script>
<script src="data/world-paths.js?v=20261120e"></script>
<script src="data/tbb-candidates-data.js?v=20261120e"></script>
<script>
(() => {
  'use strict';
  window.CGD_READY = false;
  const { element, svgEl } = window.CGDDom;
  const C = window.CGDCore;
  const GEO = window.TBB_GEO, DATA = window.TBB_DATA;

  // ---- data contract -------------------------------------------------------
  const COUNTRIES = DATA.countries, OCCS = DATA.occupations;
  (function assertContract() {
    if (!Array.isArray(COUNTRIES) || !COUNTRIES.length) throw new Error('No countries in payload.');
    const seen = new Set();
    for (const c of COUNTRIES) {
      if (!GEO.countries[c.id]) throw new Error('No geometry for ' + c.name);
      if (seen.has(c.id)) throw new Error('Duplicate country id ' + c.id);
      seen.add(c.id);
    }
    for (const o of OCCS) {
      if (o.v.length !== COUNTRIES.length) throw new Error('Count vector length mismatch: ' + o.n);
      if (o.v.some(v => !Number.isFinite(v) || v < 0)) throw new Error('Bad count in ' + o.n);
    }
  })();

  const nf = new Intl.NumberFormat('en-GB');
  const fmt = n => nf.format(Math.round(n));
  const pct = f => C.formatPercent(f, f > 0 && f < 0.01 ? 1 : 0);

  // Six sequential classes. Candidate counts run from about 140 to 35,000 at
  // the default, and from a handful to a few hundred inside one occupation, so
  // a single fixed set of bands either flattens the whole map to the darkest
  // two classes or, under a filter, to the palest one. The bands are therefore
  // log-spaced across the range actually on screen and rounded to readable
  // numbers, and the key always states them — so the colours show the spread
  // under every filter and no reader has to infer a value from a hue.
  // The palest step has to be clearly a colour, not an off-grey: at #E4F0F1 the
  // smallest pools (Costa Rica, Guatemala, the Dominican Republic) were
  // indistinguishable from the countries that are not in the catalogue at all,
  // which is the one confusion a choropleth must never allow.
  const RAMP = ['#CDE6E9', '#A7D5DB', '#79BECB', '#2D99B5', '#006970', '#0B4C5B'];
  const NICE = [1, 1.5, 2, 2.5, 3, 4, 5, 7.5, 10];
  function niceCeil(x) {
    const k = Math.pow(10, Math.floor(Math.log10(x)));
    return Math.round(k * NICE.find(m => x <= m * k + 1e-9));
  }
  /** Upper bound of each class, ascending; the last is the maximum shown. */
  function thresholds(totals) {
    const vals = totals.filter(v => v > 0);
    if (!vals.length) return [];
    const lo = Math.min(...vals), hi = Math.max(...vals);
    if (lo === hi) return [hi];
    const out = [];
    for (let i = 1; i <= RAMP.length; i++) {
      const t = i === RAMP.length ? hi : niceCeil(lo * Math.pow(hi / lo, i / RAMP.length));
      if (t >= hi) { out.push(hi); break; }
      if (!out.length || t > out[out.length - 1]) out.push(t);
    }
    return out;
  }
  const binOf = (v, ths) => { const i = ths.findIndex(t => v <= t); return i === -1 ? ths.length - 1 : i; };
  /** Fewer classes than the ramp has steps still span light to dark. */
  const rampColour = (bin, n) => n < 2 ? RAMP[RAMP.length - 1] : RAMP[Math.round(bin * (RAMP.length - 1) / (n - 1))];
  const colourOf = (v, ths) => v === 0 || !ths.length
    ? 'url(#zeroHatch)'
    : rampColour(binOf(v, ths), ths.length);
  // Every country is drawn at its true size, in its true place. Two earlier
  // attempts to make the small ones easier to see are gone, because both lied
  // about the map: a stroke in the country's own colour filled every inlet and
  // produced a lozenge, and enlarging the shape about its centre pushed it
  // into its neighbours — Trinidad and Tobago reached the coast of Venezuela,
  // Lebanon reached into the Mediterranean and down towards Jordan. Countries
  // tile the plane; there is no empty space to grow into, so any enlargement
  // takes territory that belongs to someone else.
  //
  // What a small country needs is not to be bigger but to be hittable, and
  // that can be given away for nothing: an invisible stroke, wide enough to
  // reach a usable target, carrying the same handlers as the country itself.
  // It paints nothing, so the geography is untouched. This is why the map can
  // be read on a phone where Lebanon is a pixel and a half across.
  const HIT_PX = 11, HIT_MAX = 14;
  const hitWidth = (g, k) => Math.min(HIT_MAX, Math.max(0, HIT_PX - g.m * k));

  // The gold first-phase ring is centred on the boundary, so it eats into the
  // fill from both sides — and the fill is the data. A flat 1.9px is 5-11% of
  // a country's narrow side on a laptop but a third of Bangladesh's at 320px.
  // On a narrow country in a small frame the ring thins in proportion, with a
  // floor so it never thins to nothing. Laptop widths are unchanged.
  const RING_SHARE = 0.10, RING_MAX = 1.9, RING_MIN = 0.6;
  const ringWidth = (g, k) =>
    Math.max(RING_MIN, Math.min(RING_MAX, RING_SHARE * g.m * k));

  // Fitted extent, not the whole globe: the catalogue runs from Guatemala to
  // Indonesia and from Türkiye to South Africa, so the empty Pacific and the
  // Arctic were costing about a third of the frame and shrinking every country
  // that carries data. Surrounding land is still drawn and simply clipped.
  // Computed by the build from the catalogue's own extent, so a rebuild cannot
  // leave the frame pointing at the wrong part of a re-scaled map.
  const VIEW = GEO.view;

  // ---- zoom ----------------------------------------------------------------
  // The figure was built without zoom on the grounds that nothing was out of
  // reach once the frame was fitted and the small countries enlarged. The
  // enlargement is gone — countries are drawn true, so Lebanon really is a few
  // pixels — and that makes zoom the honest way to look closely at a crowded
  // region rather than a control that earns nothing.
  //
  // Held as a centre and a factor rather than a box, so clamping stays simple
  // and a resize cannot leave the window half outside the map.
  const ZMAX = 12;
  const Z = { k: 1, cx: VIEW.x + VIEW.w / 2, cy: VIEW.y + VIEW.h / 2 };
  const r2 = n => Math.round(n * 100) / 100;
  function box() {
    const w = VIEW.w / Z.k, h = VIEW.h / Z.k;
    const cx = Math.min(Math.max(Z.cx, VIEW.x + w / 2), VIEW.x + VIEW.w - w / 2);
    const cy = Math.min(Math.max(Z.cy, VIEW.y + h / 2), VIEW.y + VIEW.h - h / 2);
    return { x: r2(cx - w / 2), y: r2(cy - h / 2), w: r2(w), h: r2(h) };
  }

  const RQF_LABEL = { 'RQF 6+': 'RQF 6+', 'RQF 3-5': 'RQF 3–5', 'RQF 1-2': 'RQF 1–2' };
  const HO_COUNT = COUNTRIES.filter(c => c.ho).length;
  const HO_WORD = { 5: 'five', 6: 'six', 7: 'seven', 8: 'eight' }[HO_COUNT] || String(HO_COUNT);

  // One band, not a skill filter plus a shortage-list checkbox. Every
  // shortage-list occupation is RQF 3–5 by construction, so the two could never
  // say anything together that either did not say alone.
  const S = { band: 'ALL', occ: 'ALL', selected: null };

  const mapEl = document.getElementById('map');
  const zoomCtl = document.getElementById('zoomCtl');
  const tooltip = document.getElementById('tooltip');
  const occSelect = document.getElementById('occSelect');
  const countrySelect = document.getElementById('countrySelect');
  const bandToggle = document.getElementById('bandToggle');

  // ---- view model ----------------------------------------------------------
  const inBand = (o, band) => band === 'ALL' ? true
    : band === 'TSL' ? o.t === 'Yes'
    : o.r === band;
  function view(s) {
    const pool = OCCS.filter(o => inBand(o, s.band));
    const rows = s.occ === 'ALL' ? pool : pool.filter(o => o.n === s.occ);
    const totals = COUNTRIES.map((_, i) => rows.reduce((a, o) => a + o.v[i], 0));
    const total = totals.reduce((a, b) => a + b, 0);
    const ho = COUNTRIES.reduce((a, c, i) => a + (c.ho ? totals[i] : 0), 0);
    return { pool, rows, totals, total, ho, withAny: totals.filter(v => v > 0).length };
  }
  // The denominator behind "share of all candidates" in the tooltip: the whole
  // catalogue, or the whole of one occupation when one is chosen — never the
  // band subtotal, which made the same country's share move for a reason the
  // reader could not see.
  function universe(s) {
    const rows = s.occ === 'ALL' ? OCCS : OCCS.filter(o => o.n === s.occ);
    return rows.reduce((a, o) => a + o.v.reduce((x, y) => x + y, 0), 0);
  }

  // ---- controls ------------------------------------------------------------
  function fillOccSelect(pool) {
    const names = pool.map(o => o.n).sort((a, b) => a.localeCompare(b));
    occSelect.replaceChildren(
      element('option', { text: `All occupations (${names.length})`, attributes: { value: 'ALL' } }),
      ...names.map(n => element('option', { text: n, attributes: { value: n } }))
    );
    if (!names.includes(S.occ)) S.occ = 'ALL';
    occSelect.value = S.occ;
  }
  // The placeholder follows the same breakpoint as the stylesheet, so the
  // wording and the width it has to fit in can never disagree. "Find a
  // country…" does not fit the narrow select and was being cut to "Find a
  // coun…", which no audit catches: a select renders its own text, so there is
  // no child element for the clipped-text check to find.
  const narrowSelect = () => window.matchMedia('(max-width:480px)').matches;
  // Below 600px the select shares the title's row and is too narrow to show a
  // country's name without cutting it. There it goes back to its placeholder
  // once a country is chosen: it is a way in, not a readout. Nothing is lost —
  // the chosen country is outlined on the map and named at the top of the card
  // that opens. Above 600px it reflects the selection, as before.
  const findOnly = () => window.matchMedia('(max-width:600px)').matches;
  function fillCountrySelect() {
    countrySelect.replaceChildren(
      element('option', { text: narrowSelect() ? 'Country…' : 'Find a country…',
                          attributes: { value: '' } }),
      ...COUNTRIES.map(c => element('option', { text: c.name + (c.ho ? ' ★' : ''), attributes: { value: c.id } }))
    );
    countrySelect.value = findOnly() ? '' : (S.selected || '');
  }
  function syncControls() {
    bandToggle.querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.band === S.band));
    });
  }

  // ---- render --------------------------------------------------------------
  let lastWidth = 960;

  function render(width) {
    lastWidth = width || lastWidth;
    const v = view(S);
    const ths = thresholds(v.totals);
    // Scale comes from the window actually shown, so the hit pads shrink and
    // the gold rings reach full width as the reader zooms in.
    const bx = box();
    const k = lastWidth / bx.w;            // frame units -> css px as drawn

    const svg = svgEl('svg', {
      viewBox: `${bx.x} ${bx.y} ${bx.w} ${bx.h}`,
      preserveAspectRatio: 'xMidYMid meet',
      role: 'img',
      'aria-label': summaryText(v)
    });

    // The hatch is defined in frame units, so left alone it scales with the
    // viewBox: a 6.5px pitch on a laptop became 1.9px with a sub-pixel line at
    // 320px, which aliases into flat grey and stops reading as a hatch at all.
    // Dividing by the scale holds the pitch at a constant 5 css px, which also
    // keeps it in step with the legend's own swatch.
    const hp = 5 / k, hl = 1.6 / k;
    const defs = svgEl('defs');
    const pat = svgEl('pattern', { id: 'zeroHatch', width: hp, height: hp, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' });
    pat.append(svgEl('rect', { width: hp, height: hp, fill: '#F4F6F7' }));
    pat.append(svgEl('line', { x1: 0, y1: 0, x2: 0, y2: hp, stroke: '#B9C3C6', 'stroke-width': hl }));
    defs.append(pat);
    svg.append(defs);

    svg.append(svgEl('path', { class: 'context', d: GEO.context }));

    const fills = svgEl('g'), rings = svgEl('g'), outline = svgEl('g');
    COUNTRIES.forEach((c, i) => {
      const g = GEO.countries[c.id], n = v.totals[i], colour = colourOf(n, ths);
      // The pad sits immediately before its country and is referenced by the
      // hover rule, so a pointer on the padding lights the country itself.
      const hit = hitWidth(g, k);
      if (hit > 0.5) {
        const pad = svgEl('path', { class: 'hit', d: g.d });
        pad.style.strokeWidth = hit;
        attach(pad, c, i, v);
        fills.append(pad);
      }
      const node = svgEl('path', { class: 'country', d: g.d });
      node.style.fill = colour;
      node.setAttribute('tabindex', '0');
      node.setAttribute('role', 'img');
      node.setAttribute('data-id', c.id);
      node.setAttribute('aria-label', `${c.name}: ${fmt(n)} ${n === 1 ? 'candidate' : 'candidates'}${c.ho ? `, one of the ${HO_WORD} countries chosen for the first phase` : ''}`);
      attach(node, c, i, v);
      fills.append(node);
      if (c.ho) {
        const ring = svgEl('path', { class: 'ho-ring', d: g.d });
        ring.style.strokeWidth = ringWidth(g, k);
        rings.append(ring);
      }
      if (S.selected === c.id) outline.append(svgEl('path', { class: 'outline', d: g.d }));
    });
    svg.append(fills, rings, outline);
    svg.addEventListener('click', e => {
      if (e.target === svg || e.target.classList.contains('context')) clearSelection();
    });
    mapEl.replaceChildren(svg, zoomCtl);   // the controls are not part of the map

    renderLegend(ths);
    occSelect.value = S.occ;
    countrySelect.value = findOnly() ? '' : (S.selected || '');
  }

  function renderLegend(ths) {
    const key = (bg, label, isHo) => {
      const chip = element('span', { className: 'chip' + (isHo ? ' ho' : '') });
      if (bg) chip.style.background = bg;
      return element('span', { className: 'bin' }, [chip, element('span', { text: label })]);
    };
    // Upper bounds only: "2,501–7,500" on every class is three times the text
    // for the same information, and wraps to four rows on a phone.
    const classes = ths.map((t, i) => key(
      rampColour(i, ths.length),
      i === ths.length - 1 ? fmt(ths[i - 1] ? ths[i - 1] + 1 : 1) + '+' : '≤' + fmt(t)
    ));
    document.getElementById('scaleLegend').replaceChildren(
      element('span', { className: 'bin' }, [element('span', { text: 'Candidates:' })]),
      key('repeating-linear-gradient(45deg,#F4F6F7,#F4F6F7 2px,#B9C3C6 2px,#B9C3C6 3.5px)', 'none'),
      ...classes,
      key(null, 'first-phase country', true)
    );
  }

  function filterPhrase() {
    if (S.occ !== 'ALL') return `listed as ${S.occ.charAt(0).toLowerCase() + S.occ.slice(1)}`;
    if (S.band === 'TSL') return 'in shortage-list occupations';
    if (S.band !== 'ALL') return `in ${RQF_LABEL[S.band]} occupations`;
    return 'in TBB’s catalogue';
  }
  function summaryText(v) {
    return `World map. ${fmt(v.total)} Talent Beyond Boundaries candidates ${filterPhrase()}, `
      + `in ${v.withAny} of ${COUNTRIES.length} countries. `
      + `${pct(v.total ? v.ho / v.total : 0)} are in the ${HO_WORD} countries chosen for the first phase.`;
  }
  function renderNotes() {
    const notes = document.getElementById('notes');
    // Links open in a new tab: the figure is an iframe on a CGD page, so a
    // same-tab navigation would replace the figure inside the article rather
    // than the article itself.
    const link = (href, text) => element('a', {
      text, attributes: { href, target: '_blank', rel: 'noopener noreferrer' }
    });
    const HO = 'https://www.gov.uk/government/publications/'
      + 'lead-sponsors-refugee-eligibility-criteria/lead-sponsors-refugee-eligibility-criteria';
    const MAC = 'https://www.gov.uk/government/publications/temporary-shortage-list-stage-2-report';
    const SOC = 'https://www.ons.gov.uk/methodology/classificationsandstandards/'
      + 'standardoccupationalclassificationsoc/soc2020/'
      + 'soc2020volume1structureanddescriptionsofunitgroups';
    notes.replaceChildren(
      element('p', { attributes: { style: 'margin:0' } }, [
        element('strong', { text: 'Source: ' }),
        element('span', { text: 'Talent Beyond Boundaries catalogue of registered candidates. '
          + 'First-phase countries from the Home Office’s ' }),
        link(HO, '29 October 2026 announcement'),
        element('span', { text: '. Skill levels and TSL status obtained from the '
          + 'Migration Advisory Committee’s ' }),
        link(MAC, 'Temporary Shortage List stage 2 review (Annex 4)'),
        element('span', { text: ', via CGD’s indicative match of TBB’s occupation descriptions to ' }),
        link(SOC, 'SOC 2020 codes'),
        element('span', { text: '.' })
      ])
    );
  }

  // ---- tooltip -------------------------------------------------------------
  // Re-rendering puts a new node under a stationary cursor, and the browser
  // then fires pointerenter without the pointer having moved — so Escape would
  // hide the tooltip and the very next frame would bring it straight back.
  // Dismissal holds until the reader actually moves the pointer.
  let dismissed = false;
  function place(x, y) {
    const pad = 10, box = tooltip.getBoundingClientRect();
    const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    tooltip.style.left = Math.max(pad, Math.min(x + 12, vw - box.width - pad)) + 'px';
    tooltip.style.top = Math.max(pad, Math.min(y + 14, vh - box.height - pad)) + 'px';
  }
  function show(c, i, v, event, node) {
    if (dismissed) return;
    const n = v.totals[i], all = universe(S), share = all ? n / all : 0;
    tooltip.replaceChildren(
      element('strong', { text: c.name }),
      element('div', { className: 'tooltip-grid' }, [
        element('span', { text: 'Candidates' }), element('b', { text: fmt(n) }),
        element('span', { text: S.occ === 'ALL' ? 'Share of all candidates' : 'Share of this occupation' }),
        element('b', { text: n ? pct(share) : '—' })
      ]),
      element('div', {
        attributes: { style: 'margin-top:5px;color:#394649' },
        text: c.ho ? 'Chosen for the first phase' : 'Not chosen for the first phase'
      })
    );
    tooltip.hidden = false;
    if (event && event.clientX != null && event.clientX !== 0) place(event.clientX, event.clientY);
    else { const b = node.getBoundingClientRect(); place(b.left + b.width / 2, b.bottom); }
  }
  function attach(node, c, i, v) {
    node.addEventListener('pointerenter', e => { if (e.pointerType !== 'touch') show(c, i, v, e, node); });
    node.addEventListener('pointermove', e => {
      if (e.pointerType === 'touch') return;
      if (dismissed) { dismissed = false; show(c, i, v, e, node); return; }
      place(e.clientX, e.clientY);
    });
    node.addEventListener('pointerleave', () => { tooltip.hidden = true; });
    node.addEventListener('focus', () => { dismissed = false; show(c, i, v, null, node); });
    node.addEventListener('blur', () => { tooltip.hidden = true; });
    node.addEventListener('click', e => {
      e.stopPropagation();
      selectCountry(c.id);
    });
    node.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      selectCountry(c.id);
    });
  }
  function selectCountry(id) {
    S.selected = id;
    tooltip.hidden = true;
    const c = COUNTRIES.find(x => x.id === id);
    window.CGDTracking?.engagement('select', 'country', c.name);
    render();
    openDrill(c);
  }
  function clearSelection() {
    if (!S.selected) return;
    S.selected = null; tooltip.hidden = true; render();
  }

  // ---- country drill-down --------------------------------------------------
  // The reader has clicked one country and wants to know what its people do.
  // The band control here is the card's own: the map's filter sets its starting
  // point, but narrowing inside the card does not re-colour the map underneath.
  // The card also ignores the map's occupation filter — a list of occupations
  // filtered to one occupation is a list of one row.
  const drill = document.getElementById('drill');
  const drillList = document.getElementById('drillList');
  const occBand = document.getElementById('occBand');
  const D = { country: null, band: 'ALL' };
  let returnFocus = null;

  function openDrill(c) {
    D.country = c;
    D.band = S.band;
    returnFocus = mapEl.querySelector(`[data-id="${c.id}"]`);
    drill.hidden = false;
    renderDrill();
    document.getElementById('drillClose').focus();
    window.CGDTracking?.engagement('open', 'country_detail', c.name);
  }
  function closeDrill() {
    if (drill.hidden) return;
    drill.hidden = true;
    const back = returnFocus && returnFocus.isConnected
      ? returnFocus : mapEl.querySelector(`[data-id="${D.country?.id}"]`);
    back?.focus();
  }
  function renderDrill() {
    const c = D.country;
    if (!c) return;
    const i = COUNTRIES.indexOf(c);
    const rows = OCCS.filter(o => inBand(o, D.band) && o.v[i] > 0)
      .map(o => ({ o, n: o.v[i] }))
      .sort((a, b) => b.n - a.n || a.o.n.localeCompare(b.o.n));
    const shown = rows.reduce((a, r) => a + r.n, 0);
    const max = rows.length ? rows[0].n : 0;

    document.getElementById('drillTitle').textContent = c.name;
    document.getElementById('drillSub').textContent = rows.length
      ? `${fmt(shown)} ${shown === 1 ? 'candidate' : 'candidates'} across `
        + `${rows.length} ${rows.length === 1 ? 'occupation' : 'occupations'}`
      : 'No candidates in this group';
    occBand.querySelectorAll('button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.band === D.band)));

    if (!rows.length) {
      drillList.replaceChildren(element('p', {
        className: 'occ-empty',
        text: `No one in ${c.name}’s pool is recorded in a ${D.band === 'TSL'
          ? 'shortage-list occupation' : RQF_LABEL[D.band] + ' occupation'}.`
      }));
      return;
    }
    drillList.replaceChildren(...rows.map(({ o, n }) => {
      const bar = element('i');
      bar.style.width = (max ? Math.max(2, (n / max) * 100) : 0) + '%';
      const row = element('div', { className: 'occ-row' }, [
        element('span', { className: 'nm', text: o.n }),
        element('span', { className: 'vl', text: fmt(n) }),
        element('span', { className: 'track' }, [bar])
      ]);
      // The row already carries the occupation and the count, and under any
      // band but "All" every row shares that band — so the only thing left for
      // a tooltip to add is the skill level of a mixed list.
      if (D.band === 'ALL') row.setAttribute('data-tip', RQF_LABEL[o.r] || o.r);
      return row;
    }));
    drillList.scrollTop = 0;
  }
  occBand.addEventListener('click', e => {
    const b = e.target.closest('button[data-band]');
    if (!b) return;
    D.band = b.dataset.band;
    window.CGDTracking?.engagement('filter', 'country_detail_band', D.band);
    renderDrill();
  });
  document.getElementById('drillClose').addEventListener('click', closeDrill);
  drill.addEventListener('click', e => { if (e.target === drill) closeDrill(); });

  // ---- wiring --------------------------------------------------------------
  bandToggle.addEventListener('click', e => {
    const b = e.target.closest('button[data-band]');
    if (!b) return;
    S.band = b.dataset.band;
    afterFilter('occupation_band', S.band);
  });
  occSelect.addEventListener('change', () => {
    S.occ = occSelect.value;
    window.CGDTracking?.engagement('filter', 'occupation', S.occ);
    render();
  });
  countrySelect.addEventListener('change', () => {
    // The select is the route to the countries too small to hit on the map, so
    // it has to reach the same detail a click does.
    if (countrySelect.value) selectCountry(countrySelect.value);
    else clearSelection();
  });
  function afterFilter(label, value) {
    // A filter change can remove the chosen occupation from the list, so the
    // child control is rebuilt and reset before anything is drawn from it.
    tooltip.hidden = true;
    syncControls();
    fillOccSelect(view(S).pool);
    window.CGDTracking?.engagement('filter', label, value);
    render();
  }
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    // One layer at a time: the card first, then the selection beneath it.
    if (!drill.hidden) { closeDrill(); return; }
    dismissed = true;
    if (S.selected) clearSelection(); else tooltip.hidden = true;
  });
  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    const root = document.getElementById('vizRoot');
    if (document.fullscreenElement === root) document.exitFullscreen();
    else root.requestFullscreen?.();
  });

  syncControls();
  fillOccSelect(view(S).pool);
  // The note is the same in every state now that the download has gone, so it
  // is built once. Rebuilding it on each render would throw away focus from
  // one of its links whenever the reader zoomed or resized.
  renderNotes();
  fillCountrySelect();
  // Rebuilt when the layout crosses the breakpoint, not on every resize tick:
  // replacing the options closes an open dropdown, so it must happen only when
  // the wording actually has to change.
  window.matchMedia('(max-width:480px)')
    .addEventListener('change', () => fillCountrySelect());
  render(mapEl.getBoundingClientRect().width || 960);
  window.CGD_READY = true;   // the QA gate waits for this
  // ---- zoom and pan --------------------------------------------------------
  // Panning only moves the window, so it sets the viewBox directly; zooming
  // changes the scale that the hit pads and the gold rings are sized from, so
  // it re-renders. A render is about 3ms, and zoom arrives in discrete steps.
  function applyPan() {
    const svg = mapEl.querySelector('svg');
    if (!svg) return;
    const b = box();
    svg.setAttribute('viewBox', `${b.x} ${b.y} ${b.w} ${b.h}`);
  }
  function setZoom(k, anchor) {
    const next = Math.min(ZMAX, Math.max(1, k));
    if (next === Z.k) return;
    if (anchor) {
      // Keep the point under the cursor where it is: the reader zooms into
      // what they are looking at, not into the middle of the frame.
      const b = box();
      const ux = b.x + (anchor.x / mapEl.clientWidth) * b.w;
      const uy = b.y + (anchor.y / mapEl.clientHeight) * b.h;
      Z.cx = ux - (ux - Z.cx) * (Z.k / next);
      Z.cy = uy - (uy - Z.cy) * (Z.k / next);
    }
    Z.k = next;
    tooltip.hidden = true;
    syncZoom();
    render();
  }
  function syncZoom() {
    document.getElementById('zoomIn').disabled = Z.k >= ZMAX;
    document.getElementById('zoomOut').disabled = Z.k <= 1;
    document.getElementById('zoomReset').hidden = Z.k <= 1;
    // At rest the page must still scroll over the map on a touch screen.
    // Once zoomed, a drag is a pan, so the gesture becomes ours.
    mapEl.style.touchAction = Z.k > 1 ? 'none' : 'manipulation';
  }
  function resetZoom() {
    Z.k = 1;
    Z.cx = VIEW.x + VIEW.w / 2;
    Z.cy = VIEW.y + VIEW.h / 2;
    syncZoom();
    render();
  }
  document.getElementById('zoomIn').addEventListener('click', () => setZoom(Z.k * 1.6));
  document.getElementById('zoomOut').addEventListener('click', () => setZoom(Z.k / 1.6));
  document.getElementById('zoomReset').addEventListener('click', resetZoom);

  // Ctrl or cmd held, deliberately: a bare wheel over an embedded figure
  // traps the reader's scroll on the page it is embedded in.
  mapEl.addEventListener('wheel', e => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const r = mapEl.getBoundingClientRect();
    setZoom(Z.k * (e.deltaY < 0 ? 1.18 : 1 / 1.18),
            { x: e.clientX - r.left, y: e.clientY - r.top });
  }, { passive: false });

  const pointers = new Map();
  let panFrom = null, pinchFrom = null, moved = 0;
  mapEl.addEventListener('pointerdown', e => {
    if (e.target.closest('.zoom-ctl')) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = 0;
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchFrom = { d: Math.hypot(a.x - b.x, a.y - b.y), k: Z.k };
      panFrom = null;
    } else if (pointers.size === 1 && (Z.k > 1 || e.pointerType !== 'touch')) {
      panFrom = { x: e.clientX, y: e.clientY, cx: Z.cx, cy: Z.cy };
    }
  });
  mapEl.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinchFrom && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchFrom.d > 0) {
        const r = mapEl.getBoundingClientRect();
        setZoom(pinchFrom.k * (d / pinchFrom.d),
                { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top });
      }
      return;
    }
    if (!panFrom || Z.k <= 1) return;
    const dx = e.clientX - panFrom.x, dy = e.clientY - panFrom.y;
    moved = Math.max(moved, Math.hypot(dx, dy));
    if (moved < 4) return;
    mapEl.classList.add('panning');
    tooltip.hidden = true;
    const b = box();
    Z.cx = panFrom.cx - dx * (b.w / mapEl.clientWidth);
    Z.cy = panFrom.cy - dy * (b.h / mapEl.clientHeight);
    applyPan();
  });
  const endPointer = e => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchFrom = null;
    if (pointers.size === 0) { panFrom = null; mapEl.classList.remove('panning'); }
  };
  mapEl.addEventListener('pointerup', endPointer);
  mapEl.addEventListener('pointercancel', endPointer);
  // A drag that moved is a pan, not a click on a country.
  mapEl.addEventListener('click', e => {
    if (moved >= 4) { e.stopPropagation(); e.preventDefault(); moved = 0; }
  }, true);

  syncZoom();
  C.observeInlineSize(mapEl, w => render(w));
  window.TBB_MAP = { state: S, drill: D, zoom: Z, box, setZoom, resetZoom,
                     view: () => view(S), universe: () => universe(S),
                     render, open: selectCountry, close: closeDrill };
})();
</script>
